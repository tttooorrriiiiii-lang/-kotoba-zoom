</aside>
</div>
</div>

      '概念': {desc:'考え方やとらえ方のまとまり', emoji:'💭', parents:[], children:['存在','時間','意味']},
      '時間': {desc:'過去・現在・未来の流れ', emoji:'⏳', parents:['概念'], children:['未来','過去','現在']},
      '未来': {desc:'これから先の時間', emoji:'🔮', parents:['時間'], children:['近い未来','遠い未来']},
      '近い未来': {desc:'すぐ先の未来', emoji:'✨', parents:['未来'], children:[]},
      '遠い未来': {desc:'ずっと先の未来', emoji:'🌠', parents:['未来'], children:[]},
      '過去': {desc:'すでに過ぎた時間', emoji:'🕰️', parents:['時間'], children:[]},
      '現在': {desc:'いまこの瞬間の時間', emoji:'⌛', parents:['時間'], children:[]},
      '意味': {desc:'ことばやものごとが持つ内容', emoji:'🌀', parents:['概念'], children:['記憶','関係']},
      '記憶': {desc:'覚えている内容や経験', emoji:'🧠', parents:['意味'], children:['思い出']},
      '思い出': {desc:'心に残っている記憶', emoji:'💫', parents:['記憶'], children:[]},
      '関係': {desc:'ものごと同士のつながり', emoji:'🔗', parents:['意味'], children:['人間関係']},
      '人間関係': {desc:'人と人とのつながり', emoji:'🤝', parents:['関係'], children:[]},
      '窓': {desc:'光や視線を通す建物の一部', emoji:'🪟', parents:['建具'], children:['出窓','丸窓']},
      '出窓': {desc:'外へ少し張り出した窓', emoji:'🪟', parents:['窓'], children:[]},
      '丸窓': {desc:'丸い形をした窓', emoji:'🪟', parents:['窓'], children:[]},
      '建具': {desc:'建物に取りつける部分', emoji:'🚪', parents:['建築要素'], children:['窓','ドア']},
      'ドア': {desc:'出入りするための建具', emoji:'🚪', parents:['建具'], children:['玄関ドア']},
      '玄関ドア': {desc:'家の入口にあるドア', emoji:'🚪', parents:['ドア'], children:[]},
      '建築要素': {desc:'建物を構成する要素', emoji:'🏗️', parents:['物'], children:['建具']}
    };

    const ALIASES = {
      'いぬ':'犬','イヌ':'犬','わんこ':'犬','ワンコ':'犬','ねこ':'猫','ネコ':'猫',
      'こーひー':'コーヒー','珈琲':'コーヒー','くろわっさん':'クロワッサン','めろんぱん':'メロンパン',
      'みらい':'未来','かふぇ':'カフェ','まど':'窓'
    };

    const STARTERS = ['クロワッサン','犬','カフェ','コーヒー','窓','未来','海','椅子'];

    let currentWord = 'クロワッサン';
    let history = [{word:'クロワッサン',type:'start',note:'スタート'}];
    let moves = 0;
    let currentDir = 'up';
    const $ = s => document.querySelector(s);

    function canonical(word){ const w=String(word||'').trim(); return ALIASES[w]||w; }
    function entry(word){ return DATA[canonical(word)]||null; }
    function parents(word){ return (entry(word)?.parents||[]).filter(Boolean); }
    function children(word){ return (entry(word)?.children||[]).filter(Boolean); }
    function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function render(){
      const info=entry(currentWord)||{desc:'まだ説明がありません',emoji:'💭'};
      $('#word').textContent=currentWord;
      $('#desc').textContent=info.desc||'';
      $('#emoji').textContent=info.emoji||'💭';
      $('#bar').style.width=Math.min(100,moves/5*100)+'%';
      $('#count').textContent=moves>=5?'達成！ 🎉':moves+' / 5';
      $('#history').innerHTML=history.slice().reverse().map(x=>`<div class="h"><div class="dot ${x.type}">${x.type==='up'?'↑':x.type==='down'?'↓':'•'}</div><div class="hc"><b>${esc(x.word)}</b><span>${esc(x.note)}</span></div></div>`).join('');
    }

    function setStatus(text){ $('#status').textContent=text; }

    function startWord(word){
      const w=canonical(word);
      if(!DATA[w]){ alert('その言葉は、まだこの版の辞書に入ってへんみたいやわ🥲\n例：クロワッサン / 犬 / カフェ / コーヒー / 窓 / 未来'); return; }
      currentWord=w; history=[{word:w,type:'start',note:'スタート'}]; moves=0; setStatus('🌱 上か下を押してみてな'); render();
    }

    function openChoices(dir){
      currentDir=dir;
      const list=dir==='up'?parents(currentWord):children(currentWord);
      $('#title').textContent=dir==='up'?'↑ 抽象化候補':'↓ 具体化候補';
      $('#help').textContent=dir==='up'?`「${currentWord}」より上の階層へ。`: `「${currentWord}」より下の階層へ。`;
      if(!list.length){
        $('#choices').innerHTML=`<div class="preview"><b>${dir==='up'?'これ以上うえはないかも':'これ以上細かくはないかも'}</b><br>${dir==='up'?'かなり広い概念まで来たで。':'この言葉の下の階層はまだ登録してへんよ。'}</div>`;
      } else {
        $('#choices').innerHTML=list.map(w=>{const i=entry(w)||{desc:''}; return `<button class="choice ${dir==='down'?'down':''}" data-word="${esc(w)}"><div class="top"><span class="cw">${esc(w)}</span><span class="badge">${dir==='up'?'1段上':'1段下'}</span></div><div class="meta">${esc(i.desc||'')}</div><div class="preview">${dir==='up'?`「${currentWord}」は「${w}」の一種`:`「${w}」は「${currentWord}」の一種`}</div></button>`}).join('');
        document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>choose(btn.dataset.word,dir));
      }
      $('#modal').classList.add('show');
    }

    function choose(word,dir){
      const prev=currentWord; currentWord=canonical(word); moves++;
      history.push({word:currentWord,type:dir,note:dir==='up'?'上の階層へ':'下の階層へ'});
      $('#modal').classList.remove('show');
      setStatus(dir==='up'?`↑ 「${prev}」から1段上へ`:`↓ 「${prev}」から1段下へ`);
      const card=$('#card');
      card.animate(dir==='up'?[{transform:'translateY(16px)',opacity:.45},{transform:'translateY(0)',opacity:1}]:[{transform:'translateY(-16px)',opacity:.45},{transform:'translateY(0)',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
      render();
    }

    $('#up').onclick=()=>openChoices('up');
    $('#down').onclick=()=>openChoices('down');
    $('#start').onclick=()=>startWord($('#input').value);
    $('#input').onkeydown=e=>{if(e.key==='Enter')startWord(e.target.value)};
    $('#random').onclick=()=>startWord(STARTERS[Math.floor(Math.random()*STARTERS.length)]);
    $('#close').onclick=()=>$('#modal').classList.remove('show');
    $('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
    render();
</script>
</body>
</html>
